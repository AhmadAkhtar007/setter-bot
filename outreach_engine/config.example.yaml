offer:
  name: AI Receptionist
  description: AI receptionist that answers inbound calls, captures leads, handles FAQs and books appointments.
  sender_name: Ahmad
  cta: Open to a quick 10-minute chat this week?

target:
  countries: ["United States"]
  industries: ["plumber", "HVAC", "dentist", "med spa", "roofing"]
  max_search_results_per_query: 20

signals:
  - name: hiring_receptionist
    query_patterns:
      - '"hiring receptionist" {industry}'
      - '"front desk" hiring {industry}'
    score: 35
  - name: unanswered_calls
    query_patterns:
      - '"no one answers" {industry}'
      - '"never answers the phone" {industry}'
    score: 45
  - name: appointment_friction
    query_patterns:
      - '"call to schedule" {industry}'
    score: 15

qualification:
  min_score: 50
  require_public_email: true

ai:
  enabled: true
  model: gemini-3.5-flash-lite
  min_heuristic_score_before_ai: 15
  min_confidence: 55
  max_email_words: 90

outreach:
  send_mode: draft
  daily_cap: 25
  include_opt_out: true
  subject_template: "Quick question about {company}"

crawler:
  timeout_seconds: 12
  max_pages_per_domain: 5
  user_agent: "Mozilla/5.0 (compatible; OutreachResearchBot/1.0)"
